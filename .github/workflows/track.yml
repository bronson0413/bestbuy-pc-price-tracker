name: Capture price snapshot

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs under load, so the
    # captured_at timestamp recorded by the collector is the authoritative one,
    # not the cron time.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests PyYAML pandas matplotlib

      - name: Capture snapshot
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PYTHONPATH: src
        run: python -m tracker.collect

      - name: Rebuild chart and exports
        env:
          PYTHONPATH: src
        run: python -m tracker.report

      - name: Commit snapshot
        run: |
          git config user.name  "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/prices.sqlite reports/
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore: price snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
