name: Capture price snapshot

on:
  # The schedule is paused. The third-party pricing source exhausted its
  # free-tier quota, so every scheduled run failed without collecting anything
  # -- a workflow that cannot succeed is noise, not monitoring. Restore the
  # cron once a paid plan or an official API key is available.
  #
  # schedule:
  #   - cron: "0 */6 * * *"   # every 6 hours; the collector's own timestamp
  #                           # is authoritative, not the cron time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests PyYAML pandas matplotlib

      - name: Capture snapshot
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PYTHONPATH: src
        run: python -m tracker.collect

      - name: Rebuild chart and exports
        env:
          PYTHONPATH: src
        run: python -m tracker.report

      - name: Commit snapshot
        run: |
          git config user.name  "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/prices.sqlite reports/
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore: price snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
